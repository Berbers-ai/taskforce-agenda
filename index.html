<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terugkerende taken</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taken">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1c1a;--muted:#77736b;--line:#e6e3dc;--accent:#2f6f5e;--accent-soft:#e3efe9;--warn:#b5562b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#201f1d;--ink:#f0eee9;--muted:#9a968d;--line:#33312d;--accent:#6fbfa6;--accent-soft:#1f3a32;--warn:#e08a5f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:620px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(60px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;display:flex;gap:8px;align-items:center}
.sync{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.sync.ok{background:var(--accent-soft);color:var(--accent)}
.sync.err{background:#f6e3da;color:var(--warn)}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.day small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.day b{display:block;font-size:17px}
.day .dots{height:6px;margin-top:3px;font-size:10px;color:var(--accent);line-height:6px}
.day.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.today small{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 0;margin-bottom:16px}
.prog{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prog span{color:var(--muted);font-size:13px;white-space:nowrap}
.item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.item:first-child,.prog+.item{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:#fff;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.item .name{flex:1}
.item.done .name{color:var(--muted);text-decoration:line-through}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.time.late{color:var(--warn);font-weight:600}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.form{padding:14px 16px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=time],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input[type=text],input[type=password]{flex:1;min-width:180px}
.dbtn{font:inherit;font-size:13px;min-width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:0 8px}
.dbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px}
.primary{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.primary:disabled{opacity:.5}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;padding:2px 6px}
.small{font-size:12px;color:var(--muted)}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;min-height:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.p{padding:12px 16px;margin:0}
.p+.p{border-top:1px solid var(--line)}
ol.p{padding-left:34px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="app.js"></script>
</body>
</html>
